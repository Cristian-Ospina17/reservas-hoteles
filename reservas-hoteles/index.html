<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HotelApp</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="auth.js"></script>
</head>

<body onload="mostrarInfoUsuario()">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
<div class="container">

<a class="navbar-brand" href="index.html">HotelApp</a>

<div class="collapse navbar-collapse">
<ul class="navbar-nav ms-auto">

<li class="nav-item" id="usuarioNav"></li>
<li class="nav-item" id="registroNav"></li>

</ul>
</div>

</div>
</nav>

<section class="hero">
<div class="overlay">
<div class="container text-center hero-content">
<h1>Encuentra tu hotel ideal</h1>

<input type="text" id="buscador" class="form-control buscador" placeholder="Buscar hotel o ciudad">

</div>
</div>
</section>

<section class="container mt-5">
<div class="row" id="hotelContainer"></div>
</section>

<script type="module" src="app.js"></script>

<script>
function mostrarInfoUsuario() {
  const usuario = obtenerUsuarioActual();
  const usuarioNav = document.getElementById('usuarioNav');
  const registroNav = document.getElementById('registroNav');

  if (usuario) {
    usuarioNav.innerHTML = `
      <span class="nav-link text-white">👤 ${usuario.nombre}</span>
    `;

    registroNav.innerHTML = `
      <a class="nav-link text-danger" onclick="cerrarSesionYRedirigir()">Cerrar sesión</a>
    `;
  } else {
    usuarioNav.innerHTML = `<a class="nav-link" href="login.html">Login</a>`;
    registroNav.innerHTML = `<a class="nav-link" href="registro.html">Registro</a>`;
  }
}

function cerrarSesionYRedirigir() {
  cerrarSesion();
  window.location.href = 'login.html';
}
</script>

</body>
</html>
