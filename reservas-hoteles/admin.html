<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Panel Admin - StayEase</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body onload="verificarAccesoAdmin()">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
<div class="container">

<a class="navbar-brand" href="index.html">🏠 StayEase</a>

<ul class="navbar-nav ms-auto">
<li class="nav-item">
<a class="nav-link" href="index.html">Volver</a>
</li>
<li class="nav-item">
<a class="nav-link text-danger" href="#" onclick="cerrarSesionYRedirigir()">Cerrar sesión</a>
</li>
</ul>

</div>
</nav>

<div class="container" style="margin-top: 100px;">

<h1 class="text-center mb-4">Panel de Administración</h1>

<div class="card p-4 mb-5">
<h3 id="tituloFormulario">Crear hotel</h3>

<form id="hotelForm">

<input type="hidden" id="hotelId">

<label>Nombre</label>
<input type="text" id="nombre" class="form-control mb-3" required>

<label>Ciudad</label>
<input type="text" id="ciudad" class="form-control mb-3" required>

<label>Precio por noche</label>
<input type="number" id="precioPorNoche" class="form-control mb-3" required>

<label>Categoría</label>
<input type="text" id="categoria" class="form-control mb-3">

<label>Capacidad máxima de personas</label>
<input type="number" id="personasMax" class="form-control mb-3" placeholder="Ej: 12">

<label>Cantidad de habitaciones</label>
<input type="number" id="cantidadHabitaciones" class="form-control mb-3" placeholder="Ej: 5">

<label>Baños</label>
<input type="number" id="banos" class="form-control mb-3" placeholder="Ej: 4">

<label>URL imagen</label>
<input type="text" id="imagen" class="form-control mb-3">

<label>Descripción</label>
<textarea id="descripcion" class="form-control mb-3"></textarea>

<label>Características separadas por coma</label>
<input type="text" id="caracteristicas" class="form-control mb-3" placeholder="Piscina, Wifi, Vista al mar">

<button type="submit" class="btn btn-success w-100">
Guardar hotel
</button>

<button type="button" class="btn btn-secondary w-100 mt-2" onclick="limpiarFormularioHotel()">
Cancelar edición
</button>

</form>
</div>

<h3 class="mb-3">Hoteles registrados</h3>
<div class="row" id="hotelesAdmin"></div>

<hr class="my-5">

<div class="card p-4 mb-5" id="panelHabitaciones" style="display:none;">
<h3>Habitaciones de: <span id="nombreHotelHabitaciones"></span></h3>

<form id="habitacionForm">

<input type="hidden" id="hotelIdHabitacion">

<label>Número de habitación</label>
<input type="number" id="numeroHabitacion" class="form-control mb-3" required>

<label>Categoría</label>
<input type="text" id="categoriaHabitacion" class="form-control mb-3" placeholder="Suite, Doble, Familiar" required>

<button type="submit" class="btn btn-primary w-100">
Guardar habitación
</button>

</form>

<h4 class="mt-4">Habitaciones registradas</h4>
<div id="habitacionesLista" class="row mt-3"></div>
</div>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
