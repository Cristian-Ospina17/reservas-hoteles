<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Detalle Hotel</title>

<link rel="stylesheet" href="detalle.css">
<script src="auth.js"></script>
</head>

<body onload="verificarAutenticacion()">

<div class="detalle-container">

<div class="detalle-card">

<img id="imagenHotel" class="img-detalle">

<div class="info">
<h2 id="nombreHotel"></h2>
<p id="descripcion"></p>

<h4>Reservar</h4>

<input type="date" id="entrada">
<input type="date" id="salida">

<button onclick="mostrarPago()" class="btn-reservar">
Reservar y pagar
</button>

</div>

</div>

<!-- PAGO -->
<div id="metodosPago" class="metodos hidden">
<h3>Selecciona método de pago</h3>

<button onclick="pagar('Nequi')">Nequi</button>
<button onclick="pagar('Bancolombia')">Bancolombia</button>
<button onclick="pagar('Davivienda')">Davivienda</button>

</div>

<h3>Opiniones</h3>

<textarea id="comentario"></textarea>

<select id="rating">
<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>
</select>

<button onclick="enviarOpinion()">Enviar opinión</button>

<div id="listaOpiniones"></div>

</div>

<script type="module" src="detalle.js"></script>

</body>
</html>
