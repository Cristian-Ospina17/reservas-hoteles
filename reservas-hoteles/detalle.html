<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Detalle Hotel</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="detalle.css">
<script type="module" src="auth.js"></script>
</head>

<body onload="verificarAutenticacion()">

<a href="index.html" class="btn btn-outline-light btn-sm volver-btn-flotante"><i class="bi bi-arrow-left"></i> Volver</a>

<div class="detalle-container">

<div class="detalle-card">

<img id="imagenHotel" class="img-detalle">

<div class="info">
<h2 id="nombreHotel"></h2>
<p id="descripcion"></p>

<div class="detalles-hotel">
  <p>Precio: <span id="precioHotel">$0</span> por noche</p>
  <p>Capacidad: <span id="capacidadHotel">0</span> huespedes</p>
  <p>Calificacion: <span id="calificacionHotel">Sin calificaciones</span></p>
</div>

<div class="hotel-detalles-adicionales">
  <p><strong>Tipo:</strong> <span id="tipoHotel">-</span></p>
  <p><strong>Ubicación:</strong> <span id="ubicacionHotel">-</span></p>
  <p><strong>Habitaciones:</strong> <span id="habitacionesHotel">-</span></p>
  <p><strong>Baños:</strong> <span id="banosHotel">-</span></p>
  <div>
    <strong>Amenities:</strong>
    <ul id="amenitiesHotel" class="amenities-list"></ul>
  </div>
</div>

<h4>Selecciona fechas</h4>

<input type="date" id="entrada" placeholder="Entrada" required>
<input type="date" id="salida" placeholder="Salida" required>

<div id="resumenReserva" class="resumen-reserva hidden">
  <p>Noches: <strong id="totalNoches">0</strong></p>
  <p>Total: <strong id="totalPrecio">$0</strong></p>
</div>

<button onclick="mostrarPago()" class="btn-reservar">
💳 Reservar y pagar
</button>

</div>

</div>

<!-- PAGO -->
<div id="metodosPago" class="metodos hidden">
<h3>Selecciona método de pago</h3>

<button onclick="pagar('Nequi')">Nequi</button>
<button onclick="pagar('Bancolombia')">Bancolombia</button>
<button onclick="pagar('Davivienda')">Davivienda</button>

</div>

<h3>Opiniones</h3>
<div id="listaOpiniones" class="lista-opiniones mb-3"></div>

<textarea id="comentario" class="form-control mb-2" placeholder="Escribe tu opinión"></textarea>

<select id="rating" class="form-select mb-3">
<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>
</select>

<button onclick="enviarOpinion()" class="btn btn-outline-primary">Enviar opinión</button>

  </div>

</div>

<script type="module" src="detalle.js"></script>

</body>
</html>
