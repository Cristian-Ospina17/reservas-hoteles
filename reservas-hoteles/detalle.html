<!DOCTYPE html>
<html lang="es">
<head>

<title>Detalle Hotel</title>

</head>

<button onclick="enviarOpinion()" class="btn btn-success">

</button>

<div id="listaOpiniones" class="mt-3"></div>

</div>

<script type="module" src="detalle.js"></script>

</body>
</html>
