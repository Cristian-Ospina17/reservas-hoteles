<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">

<div class="auth-container">

<h2 class="text-center mb-4">
Iniciar sesión
</h2>

<form id="loginForm">

<label>Email</label>

<input
  type="email"
  class="form-control mb-3"
  id="emailLogin"
  required
>

<label>Contraseña</label>

<div class="password-wrapper">

  <input
    type="password"
    class="form-control"
    id="passwordLogin"
    required
  >

  <button
    type="button"
    class="btn btn-link toggle-password"
    id="btnTogglePassword"
  >

    <i class="bi bi-eye-slash" id="toggleIconLogin"></i>

  </button>

</div>

<button type="submit" class="btn btn-primary w-100 mt-3">
  Iniciar sesión
</button>

<p class="text-center mt-3">
  ¿No tienes cuenta?
  <a href="registro.html">Regístrate</a>
</p>

</form>

</div>

<script type="module">

import { iniciarSesion } from "./auth.js";

const form = document.getElementById("loginForm");
const btnTogglePassword = document.getElementById("btnTogglePassword");

form.addEventListener("submit", manejarLogin);

btnTogglePassword.addEventListener("click", function () {
  togglePassword("passwordLogin");
});

async function manejarLogin(event) {

  event.preventDefault();

  const email =
    document.getElementById("emailLogin").value.trim();

  const password =
    document.getElementById("passwordLogin").value;

  const mensajeAnterior =
    document.getElementById("errorMensaje");

  if (mensajeAnterior) {
    mensajeAnterior.textContent = "";
  }

  if (!email) {
    mostrarError("El email es obligatorio.");
    return;
  }

  if (!validarEmail(email)) {
    mostrarError("Por favor, ingresa un email válido.");
    return;
  }

  if (!password) {
    mostrarError("La contraseña es obligatoria.");
    return;
  }

  try {

    const usuario = await iniciarSesion(email, password);

    console.log("USUARIO LOGIN:", usuario);

    // Si el backend no devuelve rol, lo mandamos como USER
    const rol = usuario?.rol
      ? usuario.rol.trim().toUpperCase()
      : "USER";

    if (rol === "ADMIN") {
      window.location.href = "admin.html";
    } else {
      window.location.href = "index.html";
    }

  } catch (e) {

    console.error("ERROR LOGIN:", e);
    mostrarError(e.message);
  }
}

function validarEmail(email) {

  const regex =
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  return regex.test(email);
}

function mostrarError(mensaje) {

  let errorDiv =
    document.getElementById("errorMensaje");

  if (!errorDiv) {

    errorDiv = document.createElement("div");

    errorDiv.id = "errorMensaje";

    errorDiv.className =
      "alert alert-danger mt-3";

    document.querySelector("form")
      .appendChild(errorDiv);
  }

  errorDiv.textContent = mensaje;
}

function togglePassword(fieldId) {

  const field =
    document.getElementById(fieldId);

  const icon =
    document.getElementById("toggleIconLogin");

  if (field.type === "password") {

    field.type = "text";

    icon.classList.remove("bi-eye-slash");

    icon.classList.add("bi-eye");

  } else {

    field.type = "password";

    icon.classList.remove("bi-eye");

    icon.classList.add("bi-eye-slash");
  }
}

</script>

</body>
</html>
