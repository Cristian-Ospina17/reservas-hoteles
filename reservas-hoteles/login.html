<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script src="auth.js"></script>
</head>

<body class="auth-page" onload="redirigirSiLogueado()">

<div class="auth-container">

<h2 class="text-center mb-4">Iniciar sesión</h2>

<form onsubmit="return manejarLogin(event)">

<label>Email</label>
<input type="email" class="form-control mb-3" id="emailLogin" required>

<label>Contraseña</label>
<input type="password" class="form-control mb-3" id="passwordLogin" required>

<button type="submit" class="btn btn-primary w-100">
Iniciar sesión
</button>

<p class="text-center mt-3">
¿No tienes cuenta? <a href="registro.html">Regístrate</a>
</p>

</form>

</div>

<script>
function manejarLogin(event) {
  event.preventDefault();
  const email = document.getElementById('emailLogin').value;
  const password = document.getElementById('passwordLogin').value;

  if (iniciarSesion(email, password)) {
    window.location.href = 'index.html';
  }
}
</script>

</body>
</html>
