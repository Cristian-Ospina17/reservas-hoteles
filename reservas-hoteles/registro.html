<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<script src="auth.js"></script>

</head>

<body onload="redirigirSiLogueado()">

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="index.html">HotelApp</a>

</div>

</nav>

<div class="container mt-5">

<h2 class="text-center">Crear cuenta</h2>

<form class="col-md-4 mx-auto mt-4" id="formRegistro" onsubmit="return manejarRegistro(event)">

<label>Nombre</label>
<input type="text" class="form-control mb-3" id="nombreRegistro" required>

<label>Email</label>
<input type="email" class="form-control mb-3" id="emailRegistro" required>

<label>Contraseña</label>
<input type="password" class="form-control mb-3" id="passwordRegistro" required>

<button type="submit" class="btn btn-success w-100">
Registrarse
</button>

<p class="text-center mt-3">
¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
</p>

</form>

<script>
function manejarRegistro(event) {
  event.preventDefault();
  const nombre = document.getElementById('nombreRegistro').value;
  const email = document.getElementById('emailRegistro').value;
  const password = document.getElementById('passwordRegistro').value;
  
  if (registrarUsuario(nombre, email, password)) {
    window.location.href = 'login.html';
  }
}
</script>

</div>

</body>
</html>
