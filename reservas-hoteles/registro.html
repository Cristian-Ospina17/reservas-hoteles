<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">

<script type="module" src="auth.js"></script>
</head>

<body class="auth-page" onload="redirigirSiLogueado()">

<div class="auth-container">

<h2 class="text-center mb-4">Crear cuenta</h2>

<form onsubmit="return manejarRegistro(event)">

<label>Nombre</label>
<input type="text" class="form-control mb-3" id="nombreRegistro" required>

<label>Email</label>
<input type="email" class="form-control mb-3" id="emailRegistro" required>

<label>Contraseña</label>
<div class="password-wrapper">
  <input type="password" class="form-control" id="passwordRegistro" required>
  <button type="button" class="btn btn-link toggle-password" onclick="togglePassword('passwordRegistro')">
    <i class="bi bi-eye-slash" id="toggleIconRegistro"></i>
  </button>
</div>

<label>Confirmar Contraseña</label>
<div class="password-wrapper">
  <input type="password" class="form-control mb-3" id="confirmPasswordRegistro" required>
  <button type="button" class="btn btn-link toggle-password" onclick="togglePassword('confirmPasswordRegistro')">
    <i class="bi bi-eye-slash" id="toggleIconConfirm"></i>
  </button>
</div>

<button type="submit" class="btn btn-success w-100 mt-3">
Registrarse
</button>

<p class="text-center mt-3">
¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
</p>

</form>

</div>

<script>

async function manejarRegistro(event) {

  event.preventDefault();

  const nombre = document.getElementById('nombreRegistro').value.trim();
  const email = document.getElementById('emailRegistro').value.trim();
  const password = document.getElementById('passwordRegistro').value;
  const confirmPassword = document.getElementById('confirmPasswordRegistro').value;

  const mensajeAnterior = document.getElementById('errorMensaje');

  if (mensajeAnterior) {
    mensajeAnterior.textContent = '';
  }

  if (!nombre) {
    mostrarError('El nombre es obligatorio.');
    return;
  }

  if (!validarEmail(email)) {
    mostrarError('Por favor, ingresa un email válido.');
    return;
  }

  if (!validarContrasena(password)) {
    mostrarError('La contraseña debe tener al menos 8 caracteres, una mayúscula, una minúscula y un número.');
    return;
  }

  if (password !== confirmPassword) {
    mostrarError('Las contraseñas no coinciden.');
    return;
  }

  try {

    await registrarUsuario(nombre, email, password);

    alert('Registro exitoso. Ahora puedes iniciar sesión.');

    const urlParams = new URLSearchParams(window.location.search);
    const redirect = urlParams.get('redirect');

    window.location.href =
      'login.html' +
      (redirect ? '?redirect=' + encodeURIComponent(redirect) : '');

  } catch (e) {

    mostrarError(e.message);

  }
}

function validarEmail(email) {
  const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return regex.test(email);
}

function validarContrasena(password) {
  const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d@$!%*?&]{8,}$/;
  return regex.test(password);
}

function mostrarError(mensaje) {

  let errorDiv = document.getElementById('errorMensaje');

  if (!errorDiv) {

    errorDiv = document.createElement('div');
    errorDiv.id = 'errorMensaje';
    errorDiv.className = 'alert alert-danger mt-3';

    document.querySelector('form').appendChild(errorDiv);
  }

  errorDiv.textContent = mensaje;
}

function togglePassword(fieldId) {

  const field = document.getElementById(fieldId);

  const iconId =
    fieldId === 'passwordRegistro'
      ? 'toggleIconRegistro'
      : 'toggleIconConfirm';

  const icon = document.getElementById(iconId);

  if (field.type === 'password') {

    field.type = 'text';

    icon.classList.remove('bi-eye-slash');
    icon.classList.add('bi-eye');

  } else {

    field.type = 'password';

    icon.classList.remove('bi-eye');
    icon.classList.add('bi-eye-slash');
  }
}

</script>

</body>
</html>
